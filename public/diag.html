<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TradeLens diagnostic (temporary)</title>
<style>body{font-family:monospace;white-space:pre-wrap;word-break:break-word;padding:16px}</style>
</head>
<body>
<h1>TradeLens diagnostic — temporary page, will be removed</h1>
<pre id="out">Running…</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  const log = (s) => { out.textContent += s + '\n'; };
  const now = new Date();
  const day = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  const guestId = 'diag-' + Math.random().toString(36).slice(2);
  log('day=' + day + ' guestId=' + guestId);
  async function call(action, args) {
    try {
      const r = await fetch('./actions', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({action, args})});
      const t = await r.text();
      log('--- ' + action + ' ---');
      log('status=' + r.status);
      log('body=' + t);
      try { return JSON.parse(t); } catch (e) { return null; }
    } catch (e) {
      log('--- ' + action + ' ---');
      log('FETCH ERROR: ' + String(e));
      return null;
    }
  }
  await call('generateSignal', {pair:'EUR/USD', timeframe:'1M', simulated:false, token:'', guestId, day, pairLabel:'EUR/USD-OTC', record:true});
  const h = await call('listSignalHistory', {guestId, limit:5});
  const id = h && h.data && h.data.entries && h.data.entries[0] ? h.data.entries[0].id : null;
  log('entry id=' + id);
  if (id != null) {
    await call('setSignalOutcome', {token:'', guestId, id, outcome:'WIN'});
  }
  log('DONE');
})();
</script>
</body>
</html>
