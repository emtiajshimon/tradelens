<!doctype html>
<html><head><meta charset="utf-8"><title>diag</title></head>
<body><pre id="out">RUNNING</pre>
<script>
async function post(action, args) {
  const r = await fetch('/actions', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({action: action, args: args, actionCallId: 'diag-' + action + '-' + Date.now()})});
  const t = await r.text();
  let j = null; try { j = JSON.parse(t); } catch (e) {}
  return {http: r.status, body: j, raw: t.slice(0, 2000)};
}
async function run() {
  const out = document.getElementById('out');
  const lines = [];
  const day = new Date().toISOString().slice(0, 10);
  lines.push('day=' + day);
  const pairs = ['EUR/USD', 'GBP/USD', 'USD/JPY', 'AUD/USD', 'EUR/JPY'];
  let found = null;
  for (const pair of pairs) {
    const res = await post('generateSignal', {pair: pair, timeframe: '5M', record: false, day: day});
    lines.push('guest ' + pair + ' http=' + res.http + ' ' + JSON.stringify(res.body).slice(0, 700));
    if (res.body && res.body.data && res.body.data.signal) { found = res.body.data.signal; break; }
  }
  if (!found) {
    const em = 'diag-' + Date.now() + '@example.com';
    const su = await post('signUp', {name: 'Diag', email: em, password: 'diag-pass-12345'});
    lines.push('signUp http=' + su.http + ' ' + JSON.stringify(su.body).slice(0, 400));
    if (su.body && su.body.data && su.body.data.token) {
      const token = su.body.data.token;
      for (const pair of pairs) {
        const res = await post('generateSignal', {pair: pair, timeframe: '5M', record: true, token: token, day: day});
        lines.push('authed ' + pair + ' http=' + res.http + ' ' + JSON.stringify(res.body).slice(0, 700));
        if (res.body && res.body.data && res.body.data.signal) { found = res.body.data.signal; break; }
      }
    }
  }
  if (found) {
    lines.push('FOUND calibratedWinRate=' + found.calibratedWinRate + ' calibrationSample=' + found.calibrationSample + ' confidence=' + found.confidence + ' direction=' + found.direction);
    lines.push('HAS calibratedWinRate: ' + ('calibratedWinRate' in found));
  } else {
    lines.push('NO SIGNAL FOUND');
  }
  out.textContent = lines.join('\n');
}
run().catch(function(e) { document.getElementById('out').textContent = 'ERROR ' + e; });
</script></body></html>
